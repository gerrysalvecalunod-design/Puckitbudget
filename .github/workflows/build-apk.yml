name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          java -version
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1 || true)"
          if [ -z "$JAVA_VER_LINE" ]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi
          RAW_VER="$(printf '%s\n' "$JAVA_VER_LINE" | sed -nE 's/.*"([^"]+)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Could not parse Java version from: $JAVA_VER_LINE"
            exit 1
          fi
          MAJOR="$(printf '%s\n' "$RAW_VER" | cut -d'.' -f1)"
          if [ "$MAJOR" = "1" ]; then
            MAJOR="$(printf '%s\n' "$RAW_VER" | cut -d'.' -f2)"
          fi
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine numeric Java major version from: $RAW_VER"
            exit 1
          fi
          echo "Active Java major version: $MAJOR"
          if [ "$MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, found Java $MAJOR."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_CMD="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_CMD" ]; then
              KEYTOOL_CMD="$(command -v keytool || true)"
            fi
            if [ -z "$KEYTOOL_CMD" ]; then
              echo "::error::keytool not found in configured Java installation."
              exit 1
            fi
            "$KEYTOOL_CMD" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "Temporary debug keystore already exists at ./debug.keystore."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::./debug.keystore could not be created."
            exit 1
          fi
          echo "Verified ./debug.keystore exists."

      - name: Build debug APK
        id: build_apk
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected APK not found at exact path: $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::$APK_PATH does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK at $APK_PATH ($(wc -c < "$APK_PATH") bytes)."

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Source APK is missing or empty: $SOURCE_APK"
            exit 1
          fi
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/pucket-release-XXXXXX")"
          TARGET_APK="${RELEASE_DIR}/app-debug.apk"
          cp "$SOURCE_APK" "$TARGET_APK"
          if [ ! -f "$TARGET_APK" ] || [ ! -s "$TARGET_APK" ]; then
            echo "::error::Prepared release APK missing or empty: $TARGET_APK"
            exit 1
          fi
          echo "release_apk_path=${TARGET_APK}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at temporary runner path."

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_APK: ${{ steps.prepare_release_asset.outputs.release_apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          if [ -z "${PREPARED_APK:-}" ] || [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "::error::Prepared release APK is missing or empty."
            exit 1
          fi
          if [[ "$PREPARED_APK" != *.apk ]]; then
            echo "::error::Prepared release asset does not end with .apk."
            exit 1
          fi
          ASSET_NAME="$(basename "$PREPARED_APK")"
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be app-debug.apk, got $ASSET_NAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Intended use: Testing only (not a Play Store production release)
          - Signing: Signed only with a temporary debug keystore
          EOF
          )

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          gh release create "$RELEASE_TAG" "$PREPARED_APK" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APK_VERIFIED: ${{ steps.verify_apk.outcome }}
          ARTIFACT_UPLOADED: ${{ steps.upload_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"
            echo "Backup Actions Artifact: app-debug-apk"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` (still available)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed (outcome=${RELEASE_OUTCOME})."
            if [ "${APK_VERIFIED}" = "success" ]; then
              echo "APK build succeeded: app/build/outputs/apk/debug/app-debug.apk"
            fi
            if [ "${ARTIFACT_UPLOADED}" = "success" ]; then
              echo "Backup GitHub Actions artifact 'app-debug-apk' remains available."
            fi

            {
              echo "## Debug APK Release Warning"
              echo ""
              echo "GitHub Release publishing failed, so the latest-release direct download link was not updated for this run."
              if [ "${APK_VERIFIED}" = "success" ]; then
                echo "- Debug APK build succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)."
              fi
              if [ "${ARTIFACT_UPLOADED}" = "success" ]; then
                echo "- Normal Actions artifact \`app-debug-apk\` remains available as a backup."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
